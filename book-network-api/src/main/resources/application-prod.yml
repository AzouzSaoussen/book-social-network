spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/book_social_network
    username: username
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
      format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${EMAIL_HOSTNAME}
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          trust: "*"
          starttls:
            enable: true
            required: true
        protocol: smtp
  thymeleaf:
    prefix:
      classpath: /templates/
      suffix: .html
      mode: HTML
      encoding: UTF-8
application:
  security:
    jwt:
      secret-key : 3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
      expiration : 8640000
  mailing:
    frontend:
      activation-url: http://localhost:8080/activate-account
  cors:
    origins: http://localhost:4200,http://localhost:8080,http://localhost

  file:
    upload:
      photos-output-path: ./app/uploads
server:
  port: 8088
