name: BSN Backend API Pipeline
on:
  push:
    branches:
      - ci/pipeline
    paths:
      - book-network-api/**
      - docker/backend/**
      - docker-compose.yml
      - .github/workflows/*-backend.yml

jobs:
  compile:
    runs-on: self-hosted
    name: Compile project
    steps:
      - name: Checkout cde
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Compile project
        run: |
          cd book-network-api
          ./mvnw clean compile

  unit-tests:
    runs-on: self-hosted
    name: Unit Tests
    steps:
      - name: Checkout cde
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup JDk
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Running Unit Tests
        run: |
          cd book-network-api
          ./mvnw clean compile
  build:
    runs-on: self-hosted
    name: Build backend
    needs: [compile, unit-tests]
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Compile project
        run: |
            cd book-network-api
            ./mvnw clean compile
  build-image:
    name: Build Docker image
    runs-on: self-hosted
    needs: [build]
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Extract project version
        id: extract_version
        run: |
          cd book-network-api
          echo "VERSION=$(./mvnw -q -Dexec.executable='echo' -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN}}

      - name: Build & Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: book-network
          file: docker/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bsn-api:${{ steps.extract_version.outputs.VERSION }},${{ secrets.DOCKERHUB_USERNAME }}/bsn-api:latest
          build-args: |
            PROFILE=dev
            APP_VERSION=${{ steps.extract_version.outputs.VERSION }}

  deploy:
    name: deploy backend
    runs-on: self-hosted
    needs: [build-image]
    steps:
      - name: Create deployment folder
        uses: appleboy/ssh-action@v1.2.2
        with:
         host: ${{ secrets.VPS_HOST }}
         port: ${{ secrets.VPS_SSH_PORT }}
         username: ${{ secrets.VPS_USERNAME }}
         key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
         script: |
           mkdir -p ci-cd

      - name: Upload docker-compose to fake VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP}}
          port: ${{secrets.VPS_SSH_PORT}}
          username: ${{secrets.VPS_USERNAME}}
          key: ${{secrets.VPS_SSH_PRIVATE_KEY}}
          source: "docker-compose.yml"
          target: "ci-cd/docker-compose.yml"

      - name: Run docker-compose on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST}}
          port: ${{secrets.VPS_SSH_PORT}}
          username: ${{secrets.VPS_USERNAME}}
          key: ${{secrets.VPS_SSH_PRIVATE_KEY}}
          script: |
            export EMAIL_HOST_NAME="${{ secrets.EMAIL_HOST_NAME }}"
            export EMAIL_USERNAME="${{ secrets.EMAIL_USERNAME }}"
            export EMAIL_PASSWORD="${{ secrets.EMAIL_PASSWORD }}"
            mkdir -p ci-cd
            cd ci-cd
            docker compose pull -q
            docker compose up -d
